name: masters
description: "Masters — локальный трекер для мастера/бригады."
publish_to: 'none'
version: 0.4.7+30

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

  intl: ^0.20.3
  timezone: ^0.9.4
  csv: ^8.0.0
  excel: ^4.0.6
  http: ^1.2.0
  pdf: ^3.11.1
  flutter_local_notifications: ^17.0.0
  crypto: ^3.0.7
  file_picker: ^13.3.0
  local_auth: ^2.3.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1F1F1F"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: false
  assets:
    - assets/icon.png